name: Breakages

# Breaks the code on purpose and checks that a test notices. Not on pull requests, because it runs the
# tests once for each breakage (ADR-006).
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Part ${{ matrix.part }} of 6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: pnpm test:breakages --part=${{ matrix.part }}/6 2>&1 | tee breakages.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: breakages-${{ matrix.part }}
          path: breakages.txt
          if-no-files-found: ignore

  # Its own job, because one that was cancelled or ran out of time cannot report itself.
  report:
    name: Report
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: breakages-*
          merge-multiple: false
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A part that was cancelled never got to its last line, so go by what each one printed as it went.
          cat breakages-*/breakages.txt > all.txt 2> /dev/null || true
          grep -E '^(UNNOTICED|\?|The tests fail)' all.txt > found.txt || true
          noticed=$(grep -cE '^ok ' all.txt || true)
          reached=$(grep -cE '^(ok|UNNOTICED|\?) ' all.txt || true)
          {
            echo "**$noticed of the $reached reached were noticed.** The parts ended with: $RESULT."
            echo
            echo '```'
            cat found.txt
            echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$RESULT" = success ] && exit 0
          if [ "$RESULT" = cancelled ]; then
            title="The weekly breakage check did not finish"
          else
            title="A deliberate breakage went unnoticed"
          fi
          { echo "Run: $RUN"; echo; cat summary.md; } > body.md
          # A run tried on a branch has its answer above. An issue is for what main no longer notices.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            exit 0
          fi
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
