name: Recordings

# Records against a real Keycloak and compares the shape with what is committed, so a release that
# changes what the diagram shows gets noticed. Not on pull requests (ADR-006).
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      keycloak:
        description: Keycloak version, or latest
        default: latest

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYCLOAK_VERSION: ${{ inputs.keycloak || 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Exits 2 when the answers differ. Anything else is the run itself failing.
      - id: record
        shell: bash
        run: |
          set +e
          node scripts/record/index.ts --keycloak "$KEYCLOAK_VERSION" --check 2>&1 | tee drift.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # What it recorded when the answers differ, so a difference from where it ran can be committed.
      - if: failure() && steps.record.outputs.code == '2'
        uses: actions/upload-artifact@v7
        with:
          name: recorded
          path: drift/
          retention-days: 14
      # A run tried on a branch has its answer in its own log. An issue is for what main no longer says.
      - if: failure() && steps.record.conclusion == 'failure' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.record.outputs.code }}
        run: |
          if [ "$CODE" = "2" ]; then
            title="Recordings differ on Keycloak $KEYCLOAK_VERSION"
            what="The weekly recording did not match what is committed, on Keycloak \`$KEYCLOAK_VERSION\`."
          else
            title="The recording run failed on Keycloak $KEYCLOAK_VERSION"
            what="The weekly recording could not finish on Keycloak \`$KEYCLOAK_VERSION\`, so this says nothing about whether the answers changed. The server may not have started, or a step may have failed."
          fi
          {
            echo "$what"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            grep -v -E 'ExperimentalWarning|trace-warnings' drift.txt | tail -n 120
            echo '```'
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

  # What the page on running it yourself says to do, with its own commands, so that it cannot go on
  # promising something that stopped working. On the version recorded, which is the one it names.
  run-it-yourself:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: node scripts/record/run-yourself.ts
